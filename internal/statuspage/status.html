<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{.Code}} {{.Title}} · {{.AppName}}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; color: #e8edf7; background: radial-gradient(circle at top, #1d2942 0, #0d1320 48%, #090d16 100%); }
    main { width: min(34rem, 100%); padding: 2.75rem; text-align: center; border: 1px solid rgba(255,255,255,.1); border-radius: 1.25rem; background: rgba(15,22,36,.82); box-shadow: 0 1.5rem 5rem rgba(0,0,0,.35); backdrop-filter: blur(12px); }
    .code { margin: 0; color: #8da9ff; font-size: clamp(4rem, 18vw, 7rem); font-weight: 750; line-height: .9; letter-spacing: -.06em; }
    h1 { margin: 1.5rem 0 .75rem; font-size: clamp(1.5rem, 5vw, 2rem); }
    p { margin: 0; color: #aeb9cd; font-size: 1rem; line-height: 1.65; }
    footer { margin-top: 2rem; padding-top: 1.25rem; color: #77849b; font-size: .8rem; border-top: 1px solid rgba(255,255,255,.08); }
  </style>
</head>
<body>
  <main>
    <p class="code">{{.Code}}</p>
    <h1>{{.Title}}</h1>
    <p>{{.Message}}</p>
    <footer>{{.AppName}}</footer>
  </main>
</body>
</html>
