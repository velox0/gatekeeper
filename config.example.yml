# ─── Global scope (inherited by all listeners/servers unless overridden) ───
app_name: Goat-keeper
auth:
    cookie_name: gatekeeper_session
    session_ttl: 24h0m0s
security:
    secure_cookies: false
users:
    - username: test
      password_hash: $2a$10$LcE5wk0JkOscgj2S3p3cq.4f1GS4cW8XrSDDAAweQD29OWKLvt08K
plugins:
    aurora: false
    hearts: true
    matrix: false
# ─── Listeners ───
listeners:
    # Example 1: Catch-all listener (no server_name). Matches any host on port :8080.
    - listen: :8080
      servers:
        - upstream:
            target: http://localhost:3000
          routes:
            - path: /
              upstream: http://localhost:3000
              auth: true

    # Example 2: Virtual Host routing (with server_name). Only matches matching Host header on port :9090.
    - listen: :9090
      servers:
        - server_name: app.local
          upstream:
            target: http://localhost:5000
          routes:
            - path: /
              upstream: http://localhost:5000
              auth: true

