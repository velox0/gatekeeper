# ─── Global scope (inherited by all listeners/servers unless overridden) ───
app_name: Goat-keeper
auth:
  cookie_name: gatekeeper_session
  session_ttl: 24h0m0s
security:
  secure_cookies: true
  same_site: strict
  authorize_favicon: false
users:
  - username: test
    password_hash: $2a$10$LcE5wk0JkOscgj2S3p3cq.4f1GS4cW8XrSDDAAweQD29OWKLvt08K
plugins:
  aurora: false
  hearts: true
  matrix: false
  winxp: false
# ─── Listeners ───
listeners:
  # Example 1: Catch-all listener (no server_name). Matches any host on port :8080.
  - listen: :8080
    servers:
      - server_name: ""
        upstream:
          target: http://localhost:3000
  # Example 2: Virtual Host routing (with server_name). Only matches matching Host header on port :9090.
  - listen: :9090
    servers:
      - server_name: app.local
        upstream:
          target: http://localhost:3000
        users:
          - username: test
            password_hash: $2a$10$TVmAnyL4XOI0Y9Y5HaIm0.lu/5PbyyXm/bmEmgRUwv.dW/uBz1h0C
          - username: tester
            password_hash: $2a$10$FeKtuADezi6eeog60Uc6Z.SNcKPKlL0V0/jN1d6zAzD9ROSR8L1ZW
